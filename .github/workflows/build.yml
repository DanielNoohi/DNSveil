name: Windows build and regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - name: Restore verified optional backends
        shell: pwsh
        run: ./Scripts/Restore-XrayBackends.ps1
      - name: Build and run isolated regression checks
        run: dotnet run --project Tests/RegressionTests/RegressionTests.csproj --configuration Release
      - name: Build portable launcher
        run: dotnet build SecureDNSClientPortable/SecureDNSClientPortable.csproj --configuration Release
